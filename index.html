    <head>
        <title>Task Manager</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="task-manager.css">
    </head>

    <body>
        <div class="app">
            <h1>Task Manager</h1>

            <div class="controls">
                <input type="text" id="added-task" placeholder="Add a task...">
                <button id="add">Add</button>
            </div>

            <div class="filters">
                <div class="tasks-filter">
                    <button class="all-button">All</button>
                    <button class="completed-button">Completed</button>
                    <button class="active-button">Active</button>
                </div>
                <button class="clear">Clear completed</button>
            </div>

            <ul id="card-sec"></ul>

            <div class="meta">
                <p>Total: <span class="total">0</span></p>
                <p>Completed Tasks: <span class="completed">0</span></p>
                <p>Active Tasks: <span class="active">0</span></p>
            </div>
        </div>

        <script src="task-manager.js"></script>
    </body>
</html>
